{% extends "snippets/base.html" %}

{% block main %}
<h2 class="mb-4">プロンプトを編集</h2>

<form method="post">
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label">タイトル</label>
        <input type="text" name="title" class="form-control" value={{ prompt.title }}>
    </div>

    <div class="mb-3">
        <label class="form-label">プロンプト</label>
        <textarea name="prompt" class="form-control" rows="8">{{ prompt.prompt }}</textarea>
    </div>

    <div class="mb-3">
        <label class="form-label">説明（任意）</label>
        <textarea name="description" class="form-control" rows="4">{{ prompt.description }}</textarea>
    </div>

    
        <!-- 通常モード：言語選択あり -->
        <div class="mb-3">
            <p class="text-muted">言語: {{ prompt.language.name }}</p>
        </div>
    

    <button class="btn btn-primary">確定</button>
</form>

{% endblock %}
