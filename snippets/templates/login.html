{% load static %}
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>ログイン - Taku Archive</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #eef2f7, #f8fafc);
            font-family: 'Segoe UI', sans-serif;
        }

        .login-wrapper {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: 380px;
            border-radius: 14px;
            background: #ffffff;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            padding: 32px;
        }

        .login-title {
            font-size: 1.6rem;
            font-weight: 600;
            color: #3a4a5a;
        }

        .form-label {
            font-weight: 500;
            color: #4a5568;
        }

        .form-control {
            border-radius: 10px;
            padding: 10px 12px;
        }

        .btn-login {
            background: #4a6fa5;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
        }

        .btn-login:hover {
            background: #3b5c8a;
        }

        .login-icon {
            font-size: 40px;
            color: #4a6fa5;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <div class="login-wrapper">
        <div class="login-card">

            <div class="text-center">
                <div class="login-icon">🔐</div>
                <div class="login-title mb-4">ログイン</div>
            </div>

            {% if error_message %}
            <div class="alert alert-danger">
                {{ error_message }}
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">
                <div class="mb-3">
                    <label class="form-label">ユーザー名</label>
                    <input type="text" name="username" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">パスワード</label>
                    <input type="password" name="password" class="form-control" required>
                </div>

                <button id="login-btn" type="submit" class="btn btn-login w-100 mt-3" disabled>
                    ログイン
                </button>

            </form>

        </div>
    </div>
    <script>

        document.addEventListener("DOMContentLoaded", function () {
            const username = document.querySelector('input[name="username"]');
            const password = document.querySelector('input[name="password"]');
            const loginBtn = document.getElementById("login-btn");

            function checkInput() {
                if (username.value.trim() !== "" && password.value.trim() !== "") {
                    loginBtn.disabled = false;
                    loginBtn.style.opacity = "1";  // 明るくする
                } else {
                    loginBtn.disabled = true;
                    loginBtn.style.opacity = "0.5"; // 薄くする
                }
            }

            username.addEventListener("input", checkInput);
            password.addEventListener("input", checkInput);
        });

    </script>


</body>

</html>
