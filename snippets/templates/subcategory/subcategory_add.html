{% extends "snippets/base.html" %}

{% block main %}
<h2 class="mb-4">サブカテゴリーを追加</h2>

<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label">言語</label>
        <select id="language" name="language" class="form-select">
            {% for c in categories %}
            <option value="{{ c.pk }}">{{ c.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">カテゴリー名</label>
        <input type="text" name="name" class="form-control" placeholder="例: Pythonの基本  など">
    </div>

    <button class="btn btn-primary">追加する</button>
</form>

{% endblock %}
