{% extends "snippets/base.html" %}

{% block main %}
<h2 class="mb-4">サブカテゴリーを追加</h2>

<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        <p class="text-muted">言語:AI(プロンプト)</p>
    </div>
    <div class="mb-3">
        <label class="form-label">カテゴリー名</label>
        <input type="text" name="name" class="form-control" placeholder="例: Pythonの基本  など">
    </div>
    <div class="d-flex justify-content-end gap-2 mt-3">
    <button class="btn btn-primary">追加する</button>
    <a href="{% url 'language_detail' language.pk %}" class="btn btn-outline-secondary">
            戻る
        </a>
    </div>
</form>

{% endblock %}
