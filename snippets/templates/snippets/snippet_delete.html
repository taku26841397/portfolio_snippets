{% extends "snippets/base.html" %}

{% block main %}
<h2 class="mb-4">削除確認</h2>

<p>「{{ snippet.title }}」を本当に削除しますか？</p>

<form method="post">
    {% csrf_token %}
    <button class="btn btn-danger">削除する</button>
    <a href="{% url 'snippet_detail' snippet.pk %}" class="btn btn-secondary">
        戻る
    </a>
</form>
{% endblock %}
